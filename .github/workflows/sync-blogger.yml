name: Sync Blogger posts

on:
  schedule:
    - cron: "47 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-repository-publishing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sync published Blogger posts
        run: >-
          python scripts/sync_blogger_posts.py
          --blog-url https://myanmarcasinoguide.blogspot.com/
          --output-dir google

      - name: Commit and push Blogger archive
        shell: bash
        run: |
          git add google/
          if git diff --cached --quiet; then
            echo "No Blogger changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          china_date="$(TZ=Asia/Shanghai date +%F)"
          git commit -m "sync Blogger posts ${china_date}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
